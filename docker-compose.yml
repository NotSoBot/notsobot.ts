# the bot (the cluster manager and every shard), it waits for the api to answer before it starts them (src/run.ts).
# Settings come from .env (see .env.example)
#
# `bot-build` compiles the source into the `lib` volume and `bot` runs from it. `bot`'s image only has the dependencies,
# so a source change never recreates its container:
#   `.refresh` on discord                           compiles the mounted src into lib itself (a type error is replied
#                                                   and stops it), then loads it in place, the shards stay connected.
#                                                   `.refresh -respawn` also does the SIGUSR2 respawn below after it,
#                                                   `.refresh -pull` git pulls this checkout from github before building
#   docker compose build && docker compose up -d    or compiles here (a type error stops it), then updates the volume
#   docker compose kill -s SIGUSR2 bot              respawns the clusters one at a time (what refresh skips: bot.ts,
#                                                   apievents.ts)
#   ./respawn [--build]                             the SIGUSR2 respawn from any folder, --build compiles and updates first
# Only package-lock.json, the Dockerfile, .env or this file changing recreates `bot` on `up -d` (every shard reconnects).
# src/run.ts is the manager itself, it needs `docker compose restart bot`
services:
  bot-build:
    build:
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
      context: .
      target: build
    image: notsobot-ts-build
    restart: "no"
    volumes:
      - lib:/lib-volume

  bot:
    build:
      context: .
      target: bot
    image: notsobot-ts
    # reaps the cluster processes and passes signals on to the manager
    init: true
    network_mode: host
    restart: always
    # every cluster writes here and docker keeps it all without a limit, this keeps the last 500mb
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    # no core dumps: a cluster hitting its heap limit aborts and the host's apport wrote a 3-4gb core of it each time
    # (2026-11-15 three of cluster 78 filled the 31gb disk). the FATAL ERROR line in the log says the same
    ulimits:
      core: 0
    depends_on:
      bot-build:
        condition: service_completed_successfully
    environment:
      NOTSOBOT_API_TOKEN: ${NOTSOBOT_API_TOKEN}
      NOTSOBOT_EDITOR_PUBLIC: ${NOTSOBOT_EDITOR_PUBLIC:-}
      NOTSOBOT_CLUSTER_MEMORY: ${NOTSOBOT_CLUSTER_MEMORY:-}
      NOTSOBOT_DISCORD_TOKEN: ${NOTSOBOT_DISCORD_TOKEN}
      NOTSOBOT_GATEWAY_URL: ${NOTSOBOT_GATEWAY_URL:-}
      NOTSOBOT_LOG_LEVEL: ${NOTSOBOT_LOG_LEVEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      # writable for `.refresh`, it compiles src into it (src/libbuild.ts). git replaces a changed tsconfig.json with a new
      # file, which the container keeps seeing the old one of until `docker compose restart bot`
      - lib:/notsobot.ts/lib
      - ./src:/notsobot.ts/src:ro
      - ./tsconfig.json:/notsobot.ts/tsconfig.json:ro
      # this checkout, `.refresh -pull` fast-forwards it from github (the src mount above sees it). the bot's user (node,
      # uid 1000) has to be able to write it: `sudo chown -R 1000:1000 .` if the checkout is someone else's
      - .:/notsobot.ts/repo


volumes:
  lib:
